<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIJ — Personal Intelligence Journal</title>
<meta name="description" content="Pete's morning paper.">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PIJ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <button class="icon-btn" id="refresh-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <button class="icon-btn" id="archive-btn" aria-label="Past editions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
  </div>
  <main id="app" aria-live="polite"><div class="empty">Loading today's paper…</div></main>
</div>
<div class="drawer-bg"></div>
<aside class="drawer" aria-label="Past editions">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2>Past editions</h2>
    <button class="icon-btn" id="close-btn" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <p class="why" style="margin:0 0 8px;font-size:13px">Tip: swipe left or right on the paper to change day.</p>
  <div id="archive-list"></div>
</aside>
<div class="toast" id="toast" role="status"></div>
<script src="app/app.js"></script>
</body>
</html>
