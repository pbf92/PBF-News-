name: Push notifications

# Sends the app's own push notifications (free, no Claude usage).
# - after the app has actually published a new edition or update (so a push always opens)
# - a 6:25 AM watchdog (PST; 7:25 in summer) that warns if the app has no edition for today
# - manual "test" from the Actions tab
on:
  workflow_run:
    workflows: ["Publish app"]
    types: [completed]
  schedule:
    - cron: "25 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "send | watchdog | test"
        default: "test"

jobs:
  notify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pywebpush==2.5.0
      - name: Send
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then MODE=watchdog;
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}";
          else
            # only push if the published commit actually carried a new edition/update
            if git diff --name-only HEAD~1 HEAD | grep -q "^data/push/latest.json$"; then MODE=send;
            else echo "published commit has no new push; nothing to send"; exit 0; fi
          fi
          python scripts/notify.py "$MODE"
