name: Publish app

# Publishes the app and every edition to GitHub Pages whenever an edition lands.
# Retries once on GitHub-side glitches, and re-publishes daily at 6:10 AM PST as a safety net.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app/**"
      - "icons/**"
      - "manifest.webmanifest"
      - "sw.js"
      - "data/editions/**"
      - "data/threads.json"
  schedule:
    - cron: "10 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir -p _site/data
          cp index.html manifest.webmanifest sw.js _site/
          cp -r app icons _site/
          cp -r data/editions _site/data/
          cp data/threads.json _site/data/
      - uses: actions/configure-pages@v5

      - id: up1
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d1
        if: steps.up1.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # one automatic retry if GitHub hiccupped
      - name: Wait before retry
        if: steps.up1.outcome != 'success' || steps.d1.outcome != 'success'
        run: sleep 90
      - id: up2
        if: steps.up1.outcome != 'success' || steps.d1.outcome != 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-retry
      - id: d2
        if: steps.up1.outcome != 'success' || steps.d1.outcome != 'success'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-retry
